<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="theme-color" content="#0b1120" />
  <title>PixelForge Studio · 3D 多游戏工坊</title>
  <link rel="stylesheet" href="style.css?v=4" />
</head>
<body>
  <!-- ========== 统一游戏大厅（Arcade Hub） ========== -->
  <section id="hubView">
    <div class="hub-inner">
      <header class="hub-header">
        <div class="hub-brand">
          <span class="hub-logo">🎮</span>
          <div>
            <h1>PixelForge Studio <span class="hub-ver">3D Arcade</span></h1>
            <p class="hub-sub">零构建、离线可用、共享 3D 内核与掌机级触屏的多游戏工坊</p>
          </div>
        </div>
        <div id="hubQuickContinue" class="hub-quick hidden"></div>
      </header>

      <div id="hubGrid" class="hub-grid"></div>

      <footer class="hub-footer">
        <span>⚡ 共享 Three.js 3D 渲染内核 · 程序化 WebAudio 合成 · 确定性物理引擎 · 全屏横屏掌机适配</span>
      </footer>
    </div>
  </section>

  <!-- ========== 统一游戏运行壳层（App Shell） ========== -->
  <div id="appShell" class="hidden">
    <header id="topbar">
      <button id="btnBackHub" class="hub-back-btn" title="返回多游戏大厅">🏠 大厅</button>
      <div class="brand">
        <span id="brandGameIcon">⛏️</span>
        <b id="brandGameTitle">PixelForge</b>
      </div>
      <div id="gameTopbarSlot" class="slot-row"></div>
      <div class="group right-tools">
        <button id="btnGlobalFs" title="全屏 / 锁定横屏体验">⛶ 全屏</button>
        <button id="btnGlobalBgm" class="toggle active" title="开关程序化主题 BGM">🎵 音乐</button>
      </div>
    </header>

    <main>
      <aside id="gameSideSlot"></aside>
      <div id="stage">
        <div id="gameHudSlot"></div>
        <div id="gameFloatSlot" class="float-play-bar hidden"></div>
        <div id="gameOverlaySlot"></div>

        <!-- 共享移动端多点触控虚拟手柄（按键按当前游戏 touchProfile 自动切换） -->
        <div id="touchControls" class="hidden" aria-label="触屏控制">
          <div id="touchStick" class="touch-stick">
            <div class="stick-arrows">
              <span class="arr-u">▲</span>
              <span class="arr-d">▼</span>
              <span class="arr-l">◀</span>
              <span class="arr-r">▶</span>
            </div>
            <div id="touchKnob" class="touch-knob"></div>
          </div>
          <div class="touch-actions">
            <button id="btnTouchB" class="touch-btn touch-dash" type="button">
              <span class="tb-icon">⚡</span>
              <span class="tb-label">冲刺</span>
            </button>
            <button id="btnTouchA" class="touch-btn touch-jump" type="button">
              <span class="tb-icon">⬆</span>
              <span class="tb-label">跳跃</span>
            </button>
          </div>
        </div>

        <div id="toast"></div>
      </div>
    </main>

    <footer id="status">就绪</footer>
  </div>

  <!-- 共享内核 + 游戏清单（各游戏业务脚本由 Studio 按需懒加载） -->
  <script src="vendor/three.min.js"></script>
  <script src="core/codec.js"></script>
  <script src="core/storage.js"></script>
  <script src="core/audio.js"></script>
  <script src="core/solver.js"></script>
  <script src="core/loop.js"></script>
  <script src="core/input.js"></script>
  <script src="core/gfx3d.js"></script>
  <script src="core/studio.js"></script>
  <script src="games/registry.js"></script>
  <script>window.Studio.boot();</script>
</body>
</html>
